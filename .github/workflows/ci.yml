name: Engineering checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      LOCAL_INTEGRATION: "1"
      # These are isolated, ephemeral CI credentials and local Anvil identities only.
      PRIGENFI_DATABASE_URL: "postgres://prigenfi_ci:ci_local_testing_only@127.0.0.1:5432/prigenfi_ci"
      PRIGENFI_APP_ORIGIN: "http://127.0.0.1:3000"
      PRIGENFI_AUTH_CHAIN_ID: "31337"
      PRIGENFI_AUTH_RPC_URL: "http://127.0.0.1:8545"
      AGENT_AUTH_TEST_URL: "http://127.0.0.1:3000"
      PRIGENFI_MCP_HTTP_ENABLED: "true"
      PRIGENFI_PUBLIC_MCP_ENABLED: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prigenfi_ci
          POSTGRES_PASSWORD: ci_local_testing_only
          POSTGRES_DB: prigenfi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prigenfi_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      # Retry the same attested pinned installer after transient upstream 504s.
      - name: Install attested Foundry
        id: foundry_initial
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        continue-on-error: true
        with:
          version: v1.8.1
      - name: Retry attested Foundry installation
        if: steps.foundry_initial.outcome == 'failure'
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify pinned official Zama Sepolia registry snapshot
        run: pnpm verify:swap:source
      - name: Compile contracts and verify generated artifacts
        run: |
          pnpm contracts:build
          git diff --exit-code -- packages/shared/src/generated
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Solidity formatting
        run: forge fmt --root contracts --check
      - name: Foundry unit, adversarial, fuzz and invariant tests
        run: pnpm test:contracts
      - name: Start local chain and deploy isolated vault
        run: |
          anvil --silent > /tmp/prigenfi-anvil.log 2>&1 &
          for attempt in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pnpm local:deploy
      - name: Generate ephemeral local-only ERC-1271 proof-encryption key
        run: echo "PRIGENFI_AUTH_PROOF_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Migrate isolated Postgres agent-account tables
        run: pnpm db:agents:migrate
      - name: TypeScript, API, SDK and external MCP client integration
        run: pnpm test
      - name: Production frontend build
        run: pnpm build
      - name: Live signed-wallet agent ownership and database isolation
        run: |
          set -euo pipefail
          node apps/web/node_modules/next/dist/bin/next start apps/web --hostname 127.0.0.1 --port 3000 > /tmp/prigenfi-agent-auth-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/api/auth/session >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pnpm test:agent-accounts
          pnpm test:profile-mcp
      - name: Browser installation
        # Ubuntu-hosted runners normally have chromium shared libraries already.
        # Avoid apt-get --with-deps DNS failures caused by runner package mirrors.
        run: pnpm exec playwright install chromium
      - name: Desktop, mobile and wallet browser integration
        run: pnpm test:browser
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Validate TypeScript and agent MCP even when Foundry downloads fail.
      - name: Typed client and agent MCP checks
        run: |
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test
          pnpm build
      - name: Install pinned static analyzer and compiler
        run: |
          python3 -m venv .venv
          .venv/bin/pip install slither-analyzer==0.11.6 crytic-compile==0.4.2
          .venv/bin/solc-select install 0.8.30
      - name: All Slither detectors with explicit timestamp triage
        run: python3 scripts/security-scan.py
      - name: Verified secret scanner
        run: |
          set -euo pipefail
          run_scanner() {
            local scanner="$1"
            local status=0
            "$scanner" git . --redact --no-banner --report-format json --report-path /tmp/prigenfi-gitleaks.json || status=$?
            if [ "$status" -ne 0 ] && [ -f /tmp/prigenfi-gitleaks.json ]; then
              # Never print matched values, snippets, entropy, or fingerprints.
              python3 -c 'import json; x=json.load(open("/tmp/prigenfi-gitleaks.json")); print("REDACTED_FINDING_METADATA:",[{"path":v.get("File"),"line":v.get("StartLine"),"rule":v.get("RuleID"),"commit":v.get("Commit")} for v in x])'
            fi
            return "$status"
          }
          if curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz; then
            echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
            run_scanner /tmp/gitleaks
          else
            # Do not skip the scan if GitHub release hosting is unavailable.
            # Fetch pinned source with Go's checksum database verification.
            command -v go >/dev/null || { echo 'Go unavailable: cannot verify secrets'; exit 1; }
            GOSUMDB=sum.golang.org GOPROXY=https://proxy.golang.org go install -trimpath github.com/gitleaks/gitleaks/v8@v8.30.1
            run_scanner "$(go env GOPATH)/bin/gitleaks"
          fi
